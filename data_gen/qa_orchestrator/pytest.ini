[pytest]
minversion = 6.0
addopts = -ra -q
# Number of workers for parallel execution (requires pytest-xdist)
# -n auto: utilize all available CPU cores
# -n 4: use 4 workers
# --dist loadscope: distribute tests by scope (e.g. module/class) for better caching usage
# addopts = -n auto --dist loadscope

testpaths =
    tests

# Execution order is standard unless plugins are used.
# If using pytest-ordering:
# @pytest.mark.run(order=1)

# Markers configuration
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    flaky: marks tests as flaky
    asyncio: marks tests as async (pytest-asyncio)

# Logging configuration
log_cli = true
log_cli_level = INFO
